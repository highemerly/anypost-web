<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <!--
      RUM (next-rum). /_n-rum/ never reaches this nginx in production: the routing in front of it
      sends those paths to the collector. Elsewhere nginx answers 404 (docker/default.conf.template).
      Keep it early in <head> so the measurement is registered before the first paint. beacon.js
      does nothing when the browser sends GPC. vite-ignore: the file is not ours to bundle (Vite
      drops the attribute from the build).
    -->
    <script async vite-ignore src="/_n-rum/beacon.js"></script>

    <meta name="description" content="AnyPost - Easily share content to various social media platforms including Mastodon, Misskey, Twitter, Facebook, and more.">
    <meta name="keywords" content="social media, sharing, mastodon, misskey, twitter, facebook, cross-platform">
    <meta name="author" content="AnyPost">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="AnyPost - Social Media Sharing Tool">
    <meta property="og:description" content="Easily share content to various social media platforms">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://anypost.dev">
    <meta property="og:image" content="https://anypost.dev/og-image.png">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AnyPost - Social Media Sharing Tool">
    <meta name="twitter:description" content="Easily share content to various social media platforms">
    <meta name="twitter:image" content="https://anypost.dev/twitter-image.png">
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    
    <title>AnyPost - Social Media Sharing Tool</title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but AnyPost - Social Media Sharing Tool doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
