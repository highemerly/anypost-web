name: E2E

# 本番と同じイメージを、偽の instance-info-api と一緒に起動して Playwright を回す。
# ブランチ push（ci.yml）ではここでイメージをビルドする（push はしない。npm run build もこの中で走る）。
# 手順は手元でも同じ（e2e/compose.yml の冒頭）。
on:
  workflow_call:
    inputs:
      # 指定するとビルドせず、このイメージ（push 済み）で回す。タグ時に、デプロイするイメージ
      # そのものを確かめるため（作り直したイメージで通っても、本番に出すものの確認にならない）。
      image:
        type: string
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GHCR のパッケージは非公開。push 済みのイメージを読むのに要る
      packages: read
    env:
      # e2e/compose.yml の web が使うイメージ
      E2E_IMAGE: ${{ inputs.image || 'anypost-web:e2e' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # push 済みのイメージ（タグ時）と buildcache（ブランチ時）を読むのに要る
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ !inputs.image }}
        uses: docker/setup-buildx-action@v4

      # タグ時のビルド（docker-build.yml）が積む buildcache を読む。lockfile が同じなら
      # npm ci は飛ばされ、実質 npm run build だけになる。
      - name: Build production image (no push)
        if: ${{ !inputs.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64
          load: true
          tags: anypost-web:e2e
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Playwright を使うだけなので、スクリプトは要らない
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start web and fake API
        run: docker compose -f e2e/compose.yml up -d --wait

      - name: Run E2E
        run: npx playwright test -c e2e/playwright.config.mjs

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f e2e/compose.yml logs > e2e/compose.log 2>&1 || true

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/compose.log
